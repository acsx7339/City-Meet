services:
  city-meet-db:
    container_name: city-meet-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: city_meet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d city_meet"]
      interval: 5s
      timeout: 5s
      retries: 5

  city-meet-web:
    container_name: city-meet-web
    image: node:20-alpine
    working_dir: /app
    depends_on:
      city-meet-db:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "3001:3001"
    command: sh -c "npm install && npm start"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@city-meet-db:5432/city_meet
    restart: unless-stopped

volumes:
  postgres_data:
